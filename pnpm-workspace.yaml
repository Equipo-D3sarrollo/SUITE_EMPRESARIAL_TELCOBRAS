packages:
  - apps/*
  - packages/*

engineStrict: true

# Versiones compartidas por varios paquetes: se cambian aquí una sola vez.
# pnpm solo instala versiones con más de 24 h publicadas (minimumReleaseAge por defecto): no se agregan excepciones.
catalog:
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^24.19.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  better-auth: 1.7.17
  jsdom: ^30.1.3
  lucide-react: ^1.68.0
  react: ^19.3.1
  react-dom: ^19.3.1
  # TypeScript 6 (última versión en JS): @nestjs/cli, @nestjs/swagger y openapi-typescript aún no soportan la 7 nativa.
  typescript: ^6.0.3
  vitest: ^5.1.0
  zod: ^4.6.7

# Scripts de instalación permitidos de forma explícita. Lo que no aparece aquí no se ejecuta.
allowBuilds:
  "@swc/core": true
  esbuild: true
  # Telemetría y comprobaciones opcionales: no hacen falta para funcionar.
  "@scarf/scarf": false
  protobufjs: false
  # msw solo actualiza su worker en public/; el archivo ya está versionado.
  msw: false

peerDependencyRules:
  allowedVersions:
    # Probado: genera los tipos del OpenAPI con TypeScript 6 (solo usa la API de impresión de TS).
    openapi-typescript>typescript: "6"
